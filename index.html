<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marco Ioffredi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one quiet reading column, name + nav on top, each section is its own view (hash routes) */
:root {
  --bg: #f7f8f9;
  --surface: #ffffff;
  --fg: #1c232b;
  --muted: #5d6874;
  --line: #dde2e7;
  --accent: #2c5f7c;
  --accent-soft: #e4eef3;
  --display: "Newsreader", Georgia, "Times New Roman", serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14191e; --surface: #1b2127; --fg: #e3e8ec; --muted: #9aa6b1;
    --line: #2c353e; --accent: #82b6d3; --accent-soft: #1f2f39; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14191e; --surface: #1b2127; --fg: #e3e8ec; --muted: #9aa6b1;
  --line: #2c353e; --accent: #82b6d3; --accent-soft: #1f2f39; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--body); font-size: 16.5px; line-height: 1.65;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; padding-block: 40px 64px; }

a { color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }

/* Header */
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px 24px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
.brand { font-family: var(--display); font-size: 1.35rem; font-weight: 500; color: var(--fg); text-decoration: none; }
nav { display: flex; flex-wrap: wrap; gap: 4px 20px; }
nav a { color: var(--muted); text-decoration: none; font-size: 0.95rem; padding-block: 4px; border-bottom: 2px solid transparent; }
nav a:hover { color: var(--fg); }
nav a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--accent); }

main { padding-top: 44px; }
h1, h2, h3 { font-family: var(--display); font-weight: 500; text-wrap: balance; line-height: 1.2; margin: 0; }
h1 { font-size: clamp(2rem, 5vw, 2.6rem); }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.15rem; font-weight: 600; }
p { margin: 0; }
.label { font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 16px; }
.section { display: flex; flex-direction: column; gap: 20px; margin-top: 48px; }
.prose { max-width: 65ch; }
.muted { color: var(--muted); }

/* About */
.intro { display: grid; grid-template-columns: 132px 1fr; gap: 28px; align-items: start; }
.portrait {
  width: 132px; aspect-ratio: 1; max-width: 100%; border-radius: 50%;
  background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center; font-family: var(--display); font-size: 2.6rem;
}
.affil { color: var(--muted); font-size: 1.02rem; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { font-size: 0.85rem; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.links { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 0.95rem; }
.news { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.news li { display: grid; grid-template-columns: 88px 1fr; gap: 16px; }
.news time, .meta { font-family: var(--mono); font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 2px; }

/* Research */
.pubs { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; }
.pub { padding-block: 18px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.pub:last-child { border-bottom: 1px solid var(--line); }
.pub-title { font-weight: 600; }
.pub-authors .me { font-weight: 600; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.pub-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 0.9rem; }
.status { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.04em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
.status.pub-ok { border-color: var(--accent); color: var(--accent); }

/* Blog */
.posts { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; }
.post-item { padding-block: 20px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.post-item:last-child { border-bottom: 1px solid var(--line); }
.post-item a.title { font-family: var(--display); font-size: 1.3rem; color: var(--fg); text-decoration: none; }
.post-item a.title:hover { color: var(--accent); }
article .body { display: flex; flex-direction: column; gap: 18px; max-width: 65ch; font-size: 1.05rem; }
article .body h3 { margin-top: 10px; }
article blockquote { margin: 0; padding-left: 18px; border-left: 2px solid var(--line); color: var(--muted); font-family: var(--display); font-size: 1.15rem; }
.back { font-size: 0.92rem; text-decoration: none; }

/* Contact */
.contact-card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.email-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.email { font-family: var(--mono); font-size: 1rem; user-select: all; overflow-wrap: anywhere; }
button { font: inherit; font-size: 0.88rem; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
button:hover { border-color: var(--accent); }

footer { margin-top: 72px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 0.85rem; color: var(--muted); }

@media (max-width: 560px) {
  .intro { grid-template-columns: 1fr; gap: 20px; }
  .portrait { width: 96px; font-size: 2rem; }
  .news li { grid-template-columns: 1fr; gap: 2px; }
}
@media (prefers-reduced-motion: no-preference) {
  main > * { animation: in .25s ease-out both; }
  @keyframes in { from { transform: translateY(4px); } to { transform: none; } }
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <a class="brand" href="#about" id="brand">Your Name</a>
    <nav id="nav" aria-label="Main">
      <a href="#about">About</a>
      <a href="#research">Research</a>
      <a href="#blog">Blog</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>
  <main id="main"></main>
  <footer id="footer"></footer>
</div>

<script>
/* ============================================================
   EDIT YOUR CONTENT HERE — everything on the site comes from
   this one block. Text in [brackets] is a placeholder.
   ============================================================ */
const SITE = {
  name: "Marco Ioffredi",
  initials: "MI",
  /* Which pages are switched on, in menu order. The first one is the home page.
     Later, change to: ["about", "research", "blog", "contact"] */
  pages: ["blog"],
  tagline: "Here are some of my thoughts ;)",
  role: "PhD Student",
  department: "[Department of Your Field]",
  university: "[Your University]",
  advisor: "[Prof. Advisor Name]",
  bio: [
    "I am a PhD student in [your field] at [Your University], working with [Prof. Advisor Name]. My research looks at [one sentence on the main question you study].",
    "Before starting my PhD, I studied [your previous degree] at [previous university]. Outside research I like [a hobby or two]."
  ],
  interests: ["[Interest one]", "[Interest two]", "[Interest three]"],
  email: "mioffredi@ethz.ch",
  links: [
    { label: "Google Scholar", url: "https://scholar.google.com/" },
    { label: "ORCID", url: "https://orcid.org/" },
    { label: "GitHub", url: "https://github.com/" },
    { label: "LinkedIn", url: "https://www.linkedin.com/" }
  ],
  news: [
    { date: "Nov 2026", text: "Launched this website." },
    { date: "Sep 2026", text: "Presented a poster at [Conference or Workshop name]." },
    { date: "Oct 2025", text: "Started my PhD at [Your University]." }
  ],
  /* status: "published" | "under review" | "in preparation" | "in progress" */
  works: [
    {
      title: "[Title of your first paper or project]",
      authors: ["Marco Ioffredi", "[Co-author]", "[Advisor Name]"],
      venue: "[Target journal or conference]",
      year: "2027",
      status: "in preparation",
      summary: "[Two lines on what the work does and why it matters.]",
      links: []
    },
    {
      title: "[Title of a workshop paper, poster or thesis]",
      authors: ["Marco Ioffredi", "[Advisor Name]"],
      venue: "[Workshop or venue name]",
      year: "2026",
      status: "published",
      summary: "[Short summary of this work.]",
      links: [{ label: "PDF", url: "#" }, { label: "Code", url: "#" }]
    }
  ],
  teaching: [
    { term: "Fall 2026", text: "Teaching assistant, [Course code: Course name]" }
  ],
  /* Blog posts: newest first. To add one, copy this template, paste it
     between the [ ] below, and fill it in. Separate posts with a comma.

    {
      slug: "my-first-post",          (short name used in the link)
      title: "My first post",
      date: "2026-11-05",             (year-month-day)
      summary: "One sentence shown in the post list.",
      body: `
        <p>First paragraph.</p>
        <h3>A subheading</h3>
        <p>Another paragraph.</p>`
    },
  */
  posts: [
  ]
};
/* ============================ end of content ============================ */

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtDate = d => new Date(d + "T12:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });

const views = {
  about() {
    return `
      <div class="intro">
        <div class="portrait" aria-hidden="true">${esc(SITE.initials)}</div>
        <div class="stack">
          <h1>${esc(SITE.name)}</h1>
          <p class="affil">${esc(SITE.role)} · ${esc(SITE.department)}<br>${esc(SITE.university)}</p>
          <div class="links">${SITE.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("")}</div>
        </div>
      </div>
      <section class="section">
        <div class="stack prose">${SITE.bio.map(p => `<p>${esc(p)}</p>`).join("")}</div>
        <div class="tags">${SITE.interests.map(i => `<span class="tag">${esc(i)}</span>`).join("")}</div>
      </section>
      <section class="section">
        <span class="label">News</span>
        <ul class="news">${SITE.news.map(n => `<li><time>${esc(n.date)}</time><span>${esc(n.text)}</span></li>`).join("")}</ul>
      </section>
      <section class="section">
        <span class="label">Latest from the blog</span>
        ${postList(SITE.posts.slice(0, 2))}
      </section>`;
  },
  research() {
    return `
      <div class="stack">
        <h1>Research</h1>
        <p class="muted prose">Papers, projects and work in progress. Advised by ${esc(SITE.advisor)}.</p>
      </div>
      <section class="section">
        <span class="label">Publications and work in progress</span>
        <ul class="pubs">${SITE.works.map(w => `
          <li class="pub">
            <span class="pub-title">${esc(w.title)}</span>
            <span class="pub-authors">${w.authors.map(a => a === SITE.name ? `<span class="me">${esc(a)}</span>` : esc(a)).join(", ")}</span>
            <div class="pub-row">
              <span class="status ${w.status === "published" ? "pub-ok" : ""}">${esc(w.status)}</span>
              <span class="muted"><em>${esc(w.venue)}</em>, ${esc(w.year)}</span>
              ${w.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("")}
            </div>
            <p class="muted">${esc(w.summary)}</p>
          </li>`).join("")}
        </ul>
      </section>
      <section class="section">
        <span class="label">Teaching</span>
        <ul class="news">${SITE.teaching.map(t => `<li><time>${esc(t.term)}</time><span>${esc(t.text)}</span></li>`).join("")}</ul>
      </section>`;
  },
  blog() {
    const solo = SITE.pages.length === 1;
    return `
      <div class="stack">
        <h1>${solo ? esc(SITE.name) : "Blog"}</h1>
        <p class="muted prose">${esc(SITE.tagline)}</p>
        <p class="meta"><a href="mailto:${esc(SITE.email)}">${esc(SITE.email)}</a></p>
      </div>
      <section class="section">${postList(SITE.posts)}</section>`;
  },
  contact() {
    return `
      <div class="stack">
        <h1>Contact</h1>
        <p class="muted prose">The best way to reach me is by email. I'm happy to talk about research, collaborations or the PhD.</p>
      </div>
      <section class="section">
        <div class="contact-card">
          <span class="label">Email</span>
          <div class="email-row">
            <span class="email" id="email">${esc(SITE.email)}</span>
            <button id="copy-email" type="button">Copy</button>
          </div>
          <span class="label">Office</span>
          <p>${esc(SITE.department)}, ${esc(SITE.university)}</p>
          <div class="links">${SITE.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("")}</div>
        </div>
      </section>`;
  }
};

function postList(posts) {
  if (!posts.length) return `<p class="muted">No posts yet. The first one is on its way.</p>`;
  return `<ul class="posts">${posts.map(p => `
    <li class="post-item">
      <span class="meta">${fmtDate(p.date)}</span>
      <a class="title" href="#post-${esc(p.slug)}">${esc(p.title)}</a>
      <p class="muted">${esc(p.summary)}</p>
    </li>`).join("")}</ul>`;
}

function postView(slug) {
  const p = SITE.posts.find(x => x.slug === slug);
  if (!p) return `<p>Post not found. <a href="#blog">Back to the blog</a></p>`;
  return `
    <article class="stack">
      <a class="back" href="#blog">← All posts</a>
      <span class="meta">${fmtDate(p.date)}</span>
      <h1>${esc(p.title)}</h1>
      <div class="body" style="margin-top:12px">${p.body}</div>
    </article>`;
}

function render() {
  const home = SITE.pages[0];
  const h = (location.hash || "#" + home).slice(1);
  let section = h.startsWith("post-") ? "blog" : (SITE.pages.includes(h) ? h : home);
  $("#main").innerHTML = h.startsWith("post-") ? postView(h.slice(5)) : views[section]();
  document.querySelectorAll("#nav a").forEach(a => {
    a.getAttribute("href") === "#" + section ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current");
  });
  const btn = $("#copy-email");
  if (btn) btn.addEventListener("click", () => {
    const done = () => { btn.textContent = "Copied"; setTimeout(() => btn.textContent = "Copy", 1600); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents($("#email")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = "Selected"; };
    try { navigator.clipboard.writeText(SITE.email).then(done, fallback); } catch (e) { fallback(); }
  });
  window.scrollTo(0, 0);
}

const LABELS = { about: "About", research: "Research", blog: "Blog", contact: "Contact" };
$("#nav").innerHTML = SITE.pages.length > 1
  ? SITE.pages.map(p => `<a href="#${p}">${LABELS[p]}</a>`).join("") : "";
$("#brand").href = "#" + SITE.pages[0];
document.querySelector("header").hidden = SITE.pages.length === 1;
$("#brand").textContent = SITE.name;
document.title = SITE.name;
$("#footer").textContent = `© ${new Date().getFullYear()} ${SITE.name}`;
addEventListener("hashchange", render);
render();
</script>
</body>
</html>
